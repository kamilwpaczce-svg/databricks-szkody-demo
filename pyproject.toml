[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szkody"
version = "0.1.0"
description = "Mini-demo Azure Databricks: szkody do weryfikacji (medallion Delta + MLflow/Unity Catalog)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "mlflow",
]

[project.optional-dependencies]
# duckdb: test jakosci wykonuje WYRAZENIA SQL z jakosc.py (to samo, co pozniej Spark).
# pyyaml: test struktury databricks.yml.
dev = [
    "pytest",
    "duckdb",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
